[package]
name = "os"
version = "0.1.0"
edition = "2018"


[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = {version="0.10.0", features=["lazy"]}
x86_64 = "0.14.2"
uart_16550 = "0.3.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]


[build]
target = "target.json"

[target.'cfg(target_os = "none")']
runner = "bootimage runner"

# [profile.dev]
# panic = "abort" # so basically this allows to terminate the process upon panic
#
[profile.release]
panic = "abort"


[package.metadata.bootimage]
build-command = ["build"]

test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 87 
test-timeout = 300    


[[test]]
name = "should_panic"
harness = false
