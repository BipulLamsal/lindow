[package]
name = "os"
version = "0.1.0"
edition = "2018"


[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = {version="0.10.0", features=["lazy"]}


[build]
target = "targert.json"

[target.'cfg(target_os = "none")']
runner = "bootimage runner"

# [profile.dev]
# panic = "abort" # so basically this allows to terminate the process upon panic
#
[profile.release]
panic = "abort"


[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04"]
